<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  #bg-video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  /* تعتيم خفيف جدًا بس عشان الكتابة تبقى واضحة، الفيديو يفضل هو الأساسي */
  .dim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.15);
    z-index: 0;
  }

  .wrap {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  form {
    width: min(320px, 100%);
    display: flex; flex-direction: column; gap: 16px;
  }

  h1 {
    color: #fff;
    font-size: 22px; font-weight: 600;
    text-align: center;
    margin: 0 0 8px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }

  input {
    background: transparent;
    border: none;
    border-bottom: 1.5px solid rgba(255,255,255,0.6);
    color: #fff;
    font-size: 16px;
    padding: 10px 4px;
    outline: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  input::placeholder { color: rgba(255,255,255,0.75); }
  input:focus { border-bottom-color: #fff; }

  button {
    margin-top: 8px;
    padding: 12px;
    border: 1.5px solid rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 15px; font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    backdrop-filter: blur(2px);
  }
  button:active { background: rgba(255,255,255,0.2); }

  #msg {
    color: #ffb3b3;
    font-size: 13px;
    text-align: center;
    min-height: 16px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

  <video id="bg-video" src="BODY.mp4" autoplay muted loop playsinline></video>
  <div class="dim"></div>

  <div class="wrap">
    <form id="login-form">
      <h1>تسجيل الدخول</h1>
      <input type="email" id="email" placeholder="البريد الإلكتروني" required />
      <input type="password" id="password" placeholder="الباسوورد" required />
      <button type="submit">دخول</button>
      <div id="msg"></div>
    </form>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script>
    // ---------- حط هنا بيانات مشروعك من Firebase (الخطوات تحت) ----------
    const firebaseConfig = {
      apiKey: "AIzaSyDYJ0_D9KT27_7NNxluz44-s2zGOVugjjQ",
      authDomain: "body-system-dadaf.firebaseapp.com",
      projectId: "body-system-dadaf",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    // ------------------------------------------------------------------

    // لو المستخدم مسجل دخول بالفعل من قبل، يدخل على طول من غير ما يشوف الفورم
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(function () {
        firebase.auth().onAuthStateChanged(function (user) {
          if (user) {
            window.location.href = "dashboard.html";
          }
        });
      });

    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const submitBtn = form.querySelector("button");
    const video = document.getElementById("bg-video");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      msg.textContent = "";
      submitBtn.disabled = true;

      // لازم نفك الصوت هنا، جوه حدث الدوسة نفسه (submit)، عشان المتصفح
      // (خصوصًا موبايل) يسمح بتشغيل الصوت. لو البيانات غلط هنرجعه مكتوم تاني.
      video.muted = false;
      video.volume = 1;
      const unmutePlay = video.play();
      if (unmutePlay && unmutePlay.catch) unmutePlay.catch(function () {});

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(function (cred) {
          // بعد نجاح تسجيل الدخول، نتأكد إن حساب العميل مفعّل فعلاً في Firestore
          return db.collection("customers").doc(cred.user.uid).get();
        })
        .then(function (docSnap) {
          if (docSnap.exists && docSnap.data().active === true) {
            // مفعّل - سيب الصوت شغال شوية قبل ما ننقله للسيستيم
            setTimeout(function () {
              window.location.href = "dashboard.html";
            }, 1200);
          } else {
            video.muted = true;
            firebase.auth().signOut();
            msg.textContent = "الحساب مش مفعّل، تواصل مع الدعم";
            submitBtn.disabled = false;
          }
        })
        .catch(function () {
          video.muted = true;
          msg.textContent = "البيانات غلط، جرب تاني";
          submitBtn.disabled = false;
        });
    });
  </script>

</body>
</html>

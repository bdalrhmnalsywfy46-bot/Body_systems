
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .login-bg-image {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  /* تعتيم خفيف جدًا بس عشان الكتابة تبقى واضحة */
  .dim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.15);
    z-index: 0;
  }

  .wrap {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  form {
    width: min(320px, 100%);
    display: flex; flex-direction: column; gap: 16px;
  }

  h1 {
    color: #fff;
    font-size: 22px; font-weight: 600;
    text-align: center;
    margin: 0 0 8px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }

  input {
    background: transparent;
    border: none;
    border-bottom: 1.5px solid rgba(255,255,255,0.6);
    color: #fff;
    font-size: 16px;
    padding: 10px 4px;
    outline: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  input::placeholder { color: rgba(255,255,255,0.75); }
  input:focus { border-bottom-color: #fff; }

  button {
    margin-top: 8px;
    padding: 12px;
    border: 1.5px solid rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 15px; font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    backdrop-filter: blur(2px);
  }
  button:active { background: rgba(255,255,255,0.2); }

  #msg {
    color: #ffb3b3;
    font-size: 13px;
    text-align: center;
    min-height: 16px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

  <img class="login-bg-image" src="logic-systems-banner-1.png" alt="background" />
  <div class="dim"></div>

  <div class="wrap">
    <form id="login-form">
      <h1>تسجيل الدخول</h1>
      <input type="email" id="email" placeholder="البريد الإلكتروني" required />
      <input type="password" id="password" placeholder="الباسوورد" required />
      <input type="text" id="emp-name" placeholder="الاسم بالكامل" style="display:none;" />
      <input type="tel" id="emp-phone" placeholder="رقم الموبايل" style="display:none;" />
      <button type="submit" id="submit-btn">دخول</button>
      <div id="msg"></div>
    </form>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script>
    // ---------- حط هنا بيانات مشروعك من Firebase (الخطوات تحت) ----------
    const firebaseConfig = {
      apiKey: "AIzaSyDYJ0_D9KT27_7NNxluz44-s2zGOVugjjQ",
      authDomain: "body-system-dadaf.firebaseapp.com",
      projectId: "body-system-dadaf",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    // ------------------------------------------------------------------

    // ---------- بيانات دخول الموظفين الموحّدة ----------
    // الإيميل ثابت، أما الباسورد فبيتغيّر من "إعدادات النظام" في الداشبورد
    // وبيتحقق منه فعليًا في Firebase Auth (مش هنا)
    const EMPLOYEE_EMAIL = "logic_system@gmail.com";

    function getDeviceId() {
      let id = localStorage.getItem("lsys_device_id");
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : "dev-" + Date.now() + "-" + Math.random().toString(16).slice(2);
        localStorage.setItem("lsys_device_id", id);
      }
      return id;
    }

    // لو رجعنا من dashboard.html برسالة (محظور / لسه تحت المراجعة...)، نعرضها هنا
    (function () {
      const pending = localStorage.getItem("lsys_login_msg");
      if (pending) {
        document.getElementById("msg").textContent = pending;
        localStorage.removeItem("lsys_login_msg");
      }
    })();

    // لو المستخدم مسجل دخول بالفعل من قبل، يدخل على طول من غير ما يشوف الفورم
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(function () {
        firebase.auth().onAuthStateChanged(function (user) {
          if (user) {
            window.location.href = "dashboard.html";
          }
        });
      });

    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const nameInput = document.getElementById("emp-name");
    const phoneInput = document.getElementById("emp-phone");

    let awaitingEmployeeDetails = false;

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      msg.textContent = "";

      const isEmployeeCreds = email.toLowerCase() === EMPLOYEE_EMAIL;

      if (isEmployeeCreds) {
        const empId = localStorage.getItem("lsys_emp_id");

        if (!empId && !awaitingEmployeeDetails) {
          // أول مرة على الجهاز ده - نطلب الاسم والرقم قبل ما نبعت الطلب
          nameInput.style.display = "block";
          phoneInput.style.display = "block";
          nameInput.required = true;
          phoneInput.required = true;
          submitBtn.textContent = "إرسال طلب الدخول";
          awaitingEmployeeDetails = true;
          msg.textContent = "دخلت أول مرة، اكتب اسمك ورقمك وابعت الطلب";
          return;
        }

        if (!empId && awaitingEmployeeDetails) {
          const name = nameInput.value.trim();
          const phone = phoneInput.value.trim();
          if (!name || !phone) { msg.textContent = "اكتب الاسم والرقم"; return; }

          submitBtn.disabled = true;
          firebase.auth().signInWithEmailAndPassword(EMPLOYEE_EMAIL, password)
            .then(function () {
              return db.collection("employeeRequests").add({
                name: name,
                phone: phone,
                deviceId: getDeviceId(),
                status: "pending",
                totalMinutes: 0,
                createdAt: Date.now(),
                updatedAt: Date.now(),
                lastLoginAt: null,
                blockedUntil: null
              });
            })
            .then(function (docRef) {
              localStorage.setItem("lsys_emp_id", docRef.id);
              return firebase.auth().signOut();
            })
            .then(function () {
              msg.textContent = "تم إرسال طلبك، استنى موافقة الأدمن ✅";
              nameInput.style.display = "none";
              phoneInput.style.display = "none";
              nameInput.value = ""; phoneInput.value = "";
              submitBtn.textContent = "دخول";
              awaitingEmployeeDetails = false;
              submitBtn.disabled = false;
            })
            .catch(function () {
              msg.textContent = "حصل خطأ، جرب تاني";
              submitBtn.disabled = false;
            });
          return;
        }

        // جهاز موافَق عليه قبل كده - نسجل دخوله ونسيب dashboard.html يتأكد من حالته
        submitBtn.disabled = true;
        firebase.auth().signInWithEmailAndPassword(EMPLOYEE_EMAIL, password)
          .then(function () {
            window.location.href = "dashboard.html";
          })
          .catch(function () {
            msg.textContent = "حصل خطأ، جرب تاني";
            submitBtn.disabled = false;
          });
        return;
      }

      // ---------- دخول الأدمن العادي ----------
      submitBtn.disabled = true;
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(function (cred) {
          // بعد نجاح تسجيل الدخول، نتأكد إن حساب العميل مفعّل فعلاً في Firestore
          return db.collection("customers").doc(cred.user.uid).get();
        })
        .then(function (docSnap) {
          if (docSnap.exists && docSnap.data().active === true) {
            // مفعّل - غيّر ده لرابط صفحة السيستيم الحقيقية بتاعك
            window.location.href = "dashboard.html";
          } else {
            firebase.auth().signOut();
            msg.textContent = "الحساب مش مفعّل، تواصل مع الدعم";
            submitBtn.disabled = false;
          }
        })
        .catch(function () {
          msg.textContent = "البيانات غلط، جرب تاني";
          submitBtn.disabled = false;
        });
    });
  </script>

</body>
</html>

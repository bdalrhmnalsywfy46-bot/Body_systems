<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>تسجيل الدخول</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .login-bg-image {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  .dim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 0;
  }

  .wrap {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  form {
    width: min(320px, 100%);
    display: flex; flex-direction: column; gap: 16px;
  }

  h1 {
    color: #fff;
    font-size: 22px; font-weight: 600;
    text-align: center;
    margin: 0 0 8px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }

  input {
    background: rgba(0,0,0,0.25);
    border: none;
    border-bottom: 1.5px solid rgba(255,255,255,0.6);
    color: #fff;
    font-size: 16px;
    padding: 10px 8px;
    outline: none;
    border-radius: 4px 4px 0 0;
  }
  input::placeholder { color: rgba(255,255,255,0.75); }
  input:focus { border-bottom-color: #7FE3F2; }

  button {
    margin-top: 8px;
    padding: 12px;
    border: 1.5px solid rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 15px; font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    backdrop-filter: blur(2px);
  }
  button:active { background: rgba(255,255,255,0.2); }
  button:disabled { opacity: 0.6; }

  #msg {
    color: #ffb3b3;
    font-size: 13px;
    text-align: center;
    min-height: 16px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  /* ---------- فيديو الافتتاح ---------- */
  .intro-overlay {
    position: fixed; inset: 0;
    z-index: 999999;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity .5s ease, transform .5s ease;
  }
  .intro-overlay.show { display: flex; }
  .intro-overlay.hide { opacity: 0; transform: scale(1.35); pointer-events: none; }
  .intro-overlay .burst-flash {
    position: absolute; inset: 0;
    pointer-events: none;
    background: radial-gradient(circle, #ffffff 0%, rgba(180,230,255,0.9) 18%, rgba(127,227,242,0.55) 40%, rgba(127,227,242,0) 68%);
    opacity: 0;
    transform: scale(0.15);
    z-index: 2;
  }
  .intro-overlay.bursting .burst-flash {
    animation: introBurstFlash .65s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes introBurstFlash {
    0%   { opacity: 0;   transform: scale(0.1); }
    30%  { opacity: 1;   transform: scale(1.1); }
    100% { opacity: 0;   transform: scale(2.4); }
  }
  .intro-overlay video {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }
</style>
</head>
<body>

  <div class="intro-overlay" id="intro-overlay">
    <video id="intro-video" src="logic-systems-intro-3-2.mp4" poster="logic-systems-logo.png" playsinline muted preload="auto"></video>
    <div class="burst-flash"></div>
  </div>

  <img class="login-bg-image" src="logic-systems-banner-1.png" alt="background" />
  <div class="dim"></div>

  <div class="wrap">
    <form id="login-form">
      <h1>تسجيل الدخول</h1>
      <input type="email" id="email" placeholder="البريد الإلكتروني" required />
      <input type="password" id="password" placeholder="الباسوورد" required />
      <input type="text" id="emp-name" placeholder="الاسم بالكامل" style="display:none;" />
      <input type="tel" id="emp-phone" placeholder="رقم الموبايل" style="display:none;" />
      <button type="submit" id="submit-btn">دخول</button>
      <div id="msg"></div>
    </form>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYJ0_D9KT27_7NNxluz44-s2zGOVugjjQ",
      authDomain: "body-system-dadaf.firebaseapp.com",
      projectId: "body-system-dadaf",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false });

    const EMPLOYEE_EMAIL = "logic_system@gmail.com";

    // ---------- فيديو الافتتاح: بيشتغل بعد ما الفايربيز يتأكد إن الدخول صح ----------
    // لما الفيديو يخلص (أو يتعمله دبل كليك تخطي) بيدخل السيستيم (dashboard.html)
    // لو تسجيل الدخول غلط، الفيديو مبيظهرش خالص ومش بيدخل حد
    var INTRO_VIDEO = "logic-systems-intro-3-2.mp4";
    var introVideoEl = document.getElementById("intro-video");

    // نبدأ نحمّل الفيديو من دلوقتي في الخلفية (من غير ما يظهر) عشان لما يجي وقته يشتغل فورًا من غير أي تأخير أو شاشة سودا
    if (introVideoEl) {
      introVideoEl.muted = true;
      introVideoEl.load();
    }

    function proceedToDashboard() {
      const overlay = document.getElementById("intro-overlay");
      const video = document.getElementById("intro-video");
      if (!overlay || !video) {
        window.location.href = "dashboard.html";
        return;
      }

      overlay.classList.remove("hide");
      overlay.classList.remove("bursting");
      overlay.classList.add("show");

      let done = false;

      function goToDashboard() {
        if (done) return;
        done = true;
        try { video.pause(); } catch (e) {}
        overlay.classList.add("bursting");
        setTimeout(function () {
          overlay.classList.add("hide");
        }, 180);
        setTimeout(function () {
          window.location.href = "dashboard.html";
        }, 550);
      }

      // بنبدأ الفيديو مكتوم عشان نضمن إنه يشتغل فورًا في كل المتصفحات
      // (المتصفحات بترفض تشغيل صوت تلقائي أحيانًا وده اللي كان بيسبب توقف/شاشة سودا)
      // وبعدها بنحاول نفك الكتم على طول، ولو رفض المتصفح، الصوت هيتفعل أول ما المستخدم يلمس/يدوس الشاشة
      video.muted = true;
      video.currentTime = 0;

      function startPlaying() {
        const p = video.play();
        if (p && p.catch) {
          p.catch(function () {
            // لو حتى التشغيل المكتوم اتأخر، نجرب تاني بعد لحظة بسيطة
            setTimeout(function () {
              video.play().catch(function () {});
            }, 150);
          });
        }
        // نحاول نفك الكتم فورًا؛ لو المتصفح رفض، هيفضل شغال مكتوم وده أحسن من إنه ميشتغلش خالص
        setTimeout(function () {
          if (done) return;
          video.muted = false;
          video.volume = 1;
          const p2 = video.play();
          if (p2 && p2.catch) {
            p2.catch(function () {
              video.muted = true; // ارجع مكتوم لو الصوت اتمنع، بس الفيديو يفضل شغال
            });
          }
        }, 60);
      }

      video.addEventListener("ended", goToDashboard, { once: true });
      video.addEventListener("error", goToDashboard, { once: true });
      video.addEventListener("dblclick", function () { goToDashboard(); });
      overlay.addEventListener("dblclick", function () { goToDashboard(); });

      function unmuteOnFirstTouch() {
        if (video.muted) {
          video.muted = false;
          video.volume = 1;
          const p = video.play();
          if (p && p.catch) p.catch(function () {});
        }
        overlay.removeEventListener("touchstart", unmuteOnFirstTouch);
        overlay.removeEventListener("click", unmuteOnFirstTouch);
      }
      overlay.addEventListener("touchstart", unmuteOnFirstTouch, { passive: true });
      overlay.addEventListener("click", unmuteOnFirstTouch);

      if (video.readyState >= 2) {
        startPlaying();
      } else {
        video.addEventListener("loadeddata", startPlaying, { once: true });
        video.addEventListener("canplay", startPlaying, { once: true });
        // احتياطي: لو التحميل اتأخر جدًا، شغّله برضه بعد نص ثانية
        setTimeout(startPlaying, 500);
      }

      // أمان: لو الفيديو حصله مشكلة ومكملش، بعد 15 ثانية يدخل السيستيم برضه
      setTimeout(goToDashboard, 15000);
    }

    function getDeviceId() {
      let id = localStorage.getItem("lsys_device_id");
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : "dev-" + Date.now() + "-" + Math.random().toString(16).slice(2);
        localStorage.setItem("lsys_device_id", id);
      }
      return id;
    }

    // لو رجعنا من dashboard.html برسالة (محظور / لسه تحت المراجعة...)، نعرضها هنا
    (function () {
      const pending = localStorage.getItem("lsys_login_msg");
      if (pending) {
        document.getElementById("msg").textContent = pending;
        localStorage.removeItem("lsys_login_msg");
      }
    })();

    // لو المستخدم مسجل دخول بالفعل من قبل، يدخل على طول من غير ما يشوف الفورم
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(function () {
        firebase.auth().onAuthStateChanged(function (user) {
          if (user) {
            proceedToDashboard();
          }
        });
      });

    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const nameInput = document.getElementById("emp-name");
    const phoneInput = document.getElementById("emp-phone");

    let awaitingEmployeeDetails = false;

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      msg.textContent = "";

      const isEmployeeCreds = email.toLowerCase() === EMPLOYEE_EMAIL;

      if (isEmployeeCreds) {
        const empId = localStorage.getItem("lsys_emp_id");

        if (!empId && !awaitingEmployeeDetails) {
          nameInput.style.display = "block";
          phoneInput.style.display = "block";
          nameInput.required = true;
          phoneInput.required = true;
          submitBtn.textContent = "إرسال طلب الدخول";
          awaitingEmployeeDetails = true;
          msg.textContent = "دخلت أول مرة، اكتب اسمك ورقمك وابعت الطلب";
          return;
        }

        if (!empId && awaitingEmployeeDetails) {
          const name = nameInput.value.trim();
          const phone = phoneInput.value.trim();
          if (!name || !phone) { msg.textContent = "اكتب الاسم والرقم"; return; }

          submitBtn.disabled = true;
          firebase.auth().signInWithEmailAndPassword(EMPLOYEE_EMAIL, password)
            .then(function () {
              return db.collection("employeeRequests").add({
                name: name,
                phone: phone,
                deviceId: getDeviceId(),
                status: "pending",
                role: "full",
                totalMinutes: 0,
                createdAt: Date.now(),
                updatedAt: Date.now(),
                lastLoginAt: null,
                blockedUntil: null
              });
            })
            .then(function (docRef) {
              localStorage.setItem("lsys_emp_id", docRef.id);
              return firebase.auth().signOut();
            })
            .then(function () {
              msg.textContent = "تم إرسال طلبك، استنى موافقة الأدمن ✅";
              nameInput.style.display = "none";
              phoneInput.style.display = "none";
              nameInput.value = ""; phoneInput.value = "";
              submitBtn.textContent = "دخول";
              awaitingEmployeeDetails = false;
              submitBtn.disabled = false;
            })
            .catch(function (err) {
              console.error(err);
              msg.textContent = "الباسورد غلط أو حصل خطأ، جرب تاني";
              submitBtn.disabled = false;
            });
          return;
        }

        submitBtn.disabled = true;
        firebase.auth().signInWithEmailAndPassword(EMPLOYEE_EMAIL, password)
          .then(function () {
            proceedToDashboard();
          })
          .catch(function (err) {
            console.error(err);
            msg.textContent = "الباسورد غلط، جرب تاني";
            submitBtn.disabled = false;
          });
        return;
      }

      // ---------- دخول الأدمن العادي (من غير أي شرط إضافي على Firestore) ----------
      submitBtn.disabled = true;
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(function () {
          proceedToDashboard();
        })
        .catch(function (err) {
          console.error(err);
          msg.textContent = "الإيميل أو الباسورد غلط، جرب تاني";
          submitBtn.disabled = false;
        });
    });
  </script>

</body>
</html>

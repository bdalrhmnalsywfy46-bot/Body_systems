<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الرئيسية</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background:
      linear-gradient(rgba(0,0,0,0.62), rgba(0,0,0,0.62)),
      url('bg-logo.png') center / cover no-repeat fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #e6f1ff;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px;
  }

  .logo-btn {
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .logo {
    height: 64px;
    opacity: 0.95;
    display: block;
  }

  .clock-box { text-align: right; }
  .date {
    font-size: 20px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  main {
    max-width: 640px; margin: 10px auto 40px; padding: 0 18px;
  }

  h2 {
    font-size: 15px; color: #7d97b8; font-weight: 600;
    margin: 24px 0 12px;
  }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(120,170,255,0.15);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card .name {
    font-size: 16px; font-weight: 600; margin-bottom: 4px;
  }
  .card .system {
    font-size: 13px; color: #9db4d1; margin-bottom: 10px;
  }
  .card .row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px;
  }
  .card .deadline { color: #cfe0f5; }
  .card .countdown {
    padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 12px;
  }
  .countdown.ok { background: rgba(56,189,131,0.15); color: #4ade80; }
  .countdown.soon { background: rgba(250,204,21,0.15); color: #facc15; }
  .countdown.late { background: rgba(248,113,113,0.15); color: #f87171; }
  .countdown.done { background: rgba(56,189,131,0.2); color: #4ade80; }

  .card.delivered { opacity: 0.6; }
  .card.delivered .name { text-decoration: line-through; }

  /* ---------- شيت الإجراءات (دوسة طويلة) ---------- */
  .action-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 60;
  }
  .action-overlay.open { display: flex; }
  .action-sheet {
    background: #0a0a0a; width: 100%; max-width: 640px;
    border-radius: 18px 18px 0 0;
    padding: 8px 18px 26px;
    border-top: 1px solid rgba(127,227,242,0.25);
  }
  .action-sheet .action-title {
    text-align: center; color: #7d97b8; font-size: 13px;
    padding: 14px 0; font-weight: 600;
  }
  .action-sheet button {
    width: 100%; text-align: right; padding: 14px 6px;
    background: none; border: none; border-top: 1px solid rgba(255,255,255,0.08);
    color: #e6f1ff; font-size: 15px; cursor: pointer;
  }
  .action-sheet button.danger { color: #f87171; }
  .action-sheet button.cancel-btn {
    color: #7d97b8; border-top: none; margin-top: 8px; text-align: center;
  }

  /* ---------- سجل العملاء (تفاصيل كاملة) ---------- */
  .log-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(120,170,255,0.15);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .log-card .name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .log-card .row2 {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #9db4d1; padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .log-card .row2 span:first-child { color: #6b7f99; }
  .log-card .notes {
    margin-top: 8px; font-size: 13px; color: #cfe0f5;
    background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px;
  }

  .empty {
    text-align: center; color: #6b7f99; font-size: 13px; padding: 30px 0;
  }

  /* ---------- شريط الإحصائيات + الساعة الكبيرة ---------- */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(10,10,10,0.85); border: 2px solid #7FE3F2;
    box-shadow: 0 0 14px rgba(127,227,242,0.25);
    border-radius: 14px; padding: 16px 6px; margin-top: 16px;
  }
  .stats-bar .stat { text-align: center; }
  .stats-bar .num { font-size: 22px; font-weight: 700; color: #e6f1ff; }
  .stats-bar .lbl { font-size: 11px; color: #7d97b8; margin-top: 4px; }

  .big-clock {
    text-align: center; font-size: 46px; font-weight: 700;
    color: #e6f1ff; margin-top: 28px; letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .big-clock-period {
    text-align: center; font-size: 13px; color: #7d97b8; margin-top: 2px; margin-bottom: 10px;
  }

  .late-header {
    background: #0a0a0a; border: 1px solid rgba(248,113,113,0.3);
    border-radius: 12px 12px 0 0; padding: 14px 16px;
    font-size: 14px; font-weight: 700; color: #f87171;
    margin-top: 28px;
  }
  #late-list {
    border: 1px solid rgba(248,113,113,0.2); border-top: none;
    border-radius: 0 0 12px 12px; padding: 4px 12px 12px;
    margin-bottom: 6px;
  }
  #late-list .empty { padding: 14px 0; }

  /* ---------- القائمة الجانبية ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 40;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .sidebar-frame {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(300px, 82vw);
    background: linear-gradient(to bottom, #D4AF37 0%, #D4AF37 48%, #7FE3F2 52%, #7FE3F2 100%);
    padding: 4px 0 0 4px;
    box-sizing: border-box;
    transform: translateX(100%);
    transition: transform 0.28s ease;
    z-index: 50;
  }
  .sidebar-frame.open { transform: translateX(0); }

  .sidebar {
    background: #051019;
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    padding: 20px;
    overflow-y: auto;
    position: relative;
  }

  .sidebar-logo-card {
    position: relative;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    margin: 30px 0 20px;
    border: 2px solid #D4AF37;
  }
  .sidebar-logo-card img {
    width: 100%; display: block;
  }
  .sidebar-logo-card::after {
    content: "";
    position: absolute;
    top: -20%; left: -150%;
    width: 55%; height: 140%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out infinite;
  }
  @keyframes shine {
    0%   { left: -150%; }
    45%  { left: 150%; }
    100% { left: 150%; }
  }

  .sidebar h3 {
    font-size: 16px; margin: 0 0 18px;
  }

  .menu-item {
    width: 100%; text-align: right;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; margin-bottom: 10px;
    background: rgba(127,227,242,0.06);
    border: 1px solid rgba(127,227,242,0.35);
    border-radius: 10px;
    color: #e6f1ff; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .menu-item:active { background: rgba(127,227,242,0.15); }

  .back-btn {
    background: none; border: none;
    color: #7FE3F2; font-size: 13px; font-weight: 600;
    padding: 0; margin-bottom: 16px; cursor: pointer;
  }
  #form-view h2 {
    color: #e6f1ff; margin-top: 4px;
  }

  #form-view label {
    display: block; font-size: 12px; color: #7d97b8; margin: 14px 0 6px;
  }
  #form-view input, #form-view textarea {
    width: 100%; padding: 10px 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(120,170,255,0.2);
    border-radius: 8px;
    color: #e6f1ff; font-size: 14px; outline: none;
    font-family: inherit;
  }
  #form-view input:focus, #form-view textarea:focus { border-color: #4F8CFF; }
  #form-view textarea { resize: vertical; min-height: 60px; }

  #form-view .primary-btn {
    width: 100%; margin-top: 20px;
    padding: 11px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff; font-weight: 600; font-size: 14px;
    cursor: pointer;
  }
  #form-view .primary-btn:active { background: #1d4ed8; }

  #form-view .msg {
    font-size: 12px; margin-top: 10px; margin-bottom: 30px; min-height: 14px;
  }
  #form-view .msg.ok { color: #4ade80; }
  #form-view .msg.err { color: #f87171; }

  .close-btn {
    position: absolute; top: 16px; left: 16px;
    background: none; border: none; color: #7d97b8;
    font-size: 20px; cursor: pointer;
  }
</style>
</head>
<body>

  <header>
    <button class="logo-btn" id="logo-btn" aria-label="فتح القائمة">
      <img class="logo" src="logo-1-1.png" alt="logo" />
    </button>
    <div class="clock-box">
      <div class="date" id="date"></div>
    </div>
  </header>

  <main>
    <div id="list-view">
      <div class="stats-bar">
        <div class="stat"><div class="num" id="stat-pending">0</div><div class="lbl">هيتسلم</div></div>
        <div class="stat"><div class="num" id="stat-done">0</div><div class="lbl">تم التسليم</div></div>
        <div class="stat"><div class="num" id="stat-late">0</div><div class="lbl">متأخر</div></div>
        <div class="stat"><div class="num" id="stat-today">0</div><div class="lbl">النهاردة</div></div>
      </div>

      <div class="big-clock" id="big-clock">--:--</div>
      <div class="big-clock-period" id="big-clock-period"></div>

      <div class="late-header">الحالات المتأخرة</div>
      <div id="late-list">
        <div class="empty">جاري التحميل...</div>
      </div>

      <h2>الأنظمة اللي هتتسلم</h2>
      <div id="list">
        <div class="empty">جاري التحميل...</div>
      </div>
    </div>

    <!-- فورم إضافة عميل جديد (بيظهر بدل القايمة) -->
    <div id="form-view" style="display:none;">
      <button class="back-btn" id="back-btn">→ رجوع</button>
      <h2>إضافة عميل جديد</h2>

      <label>اسم العميل</label>
      <input type="text" id="f-name" placeholder="مثال: أحمد محمد" />

      <label>رقم العميل</label>
      <input type="tel" id="f-phone" placeholder="01xxxxxxxxx" />

      <label>الإيميل</label>
      <input type="email" id="f-email" placeholder="example@email.com" />

      <label>نوع السيستيم</label>
      <input type="text" id="f-system" placeholder="مثال: موقع متجر إلكتروني" />

      <label>اسم المكان</label>
      <input type="text" id="f-place" placeholder="اسم المحل/الشركة" />

      <label>العنوان</label>
      <input type="text" id="f-address" placeholder="عنوان المكان" />

      <label>معاد التسليم</label>
      <input type="date" id="f-date" />

      <label>المبلغ</label>
      <input type="number" id="f-price" placeholder="بالجنيه" />

      <label>اسم المسؤول عن الاتفاق مع العميل</label>
      <input type="text" id="f-dealmaker" placeholder="اسم الشخص اللي قفل الاتفاق" />

      <label>اسم المسؤول عن تنفيذ السيستيم</label>
      <input type="text" id="f-developer" placeholder="اسم الشخص اللي هيعمل السيستيم" />

      <label>ملاحظات</label>
      <textarea id="f-notes" placeholder="أي تفاصيل إضافية"></textarea>

      <button class="primary-btn" id="add-btn">إضافة</button>
      <div class="msg" id="form-msg"></div>
    </div>

    <!-- سجل العملاء والأنظمة -->
    <div id="log-view" style="display:none;">
      <button class="back-btn" id="log-back-btn">→ رجوع</button>
      <h2>سجل العملاء والأنظمة</h2>
      <div id="log-list">
        <div class="empty">جاري التحميل...</div>
      </div>
    </div>
  </main>

  <!-- القائمة الجانبية -->
  <div class="overlay" id="overlay"></div>
  <div class="sidebar-frame" id="sidebar">
  <aside class="sidebar">
    <button class="close-btn" id="close-btn">✕</button>
    <div class="sidebar-logo-card">
      <img src="logo-2.png" alt="logo" />
    </div>

    <div id="menu-view">
      <button class="menu-item" id="open-form-btn">
        <span>➕</span> إضافة عميل جديد
      </button>
      <button class="menu-item" id="open-log-btn">
        <span>📁</span> سجل العملاء والأنظمة
      </button>
    </div>
  </aside>
  </div>

  <!-- شيت الإجراءات (دوسة طويلة على كارت) -->
  <div class="action-overlay" id="action-overlay">
    <div class="action-sheet">
      <div class="action-title" id="action-title">العميل</div>
      <button id="action-delivered">✅ استلم</button>
      <button id="action-pending">⏳ هيتسلم</button>
      <button class="danger" id="action-delete">🗑️ حذف</button>
      <button class="cancel-btn" id="action-cancel">إلغاء</button>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYJ0_D9KT27_7NNxluz44-s2zGOVugjjQ",
      authDomain: "body-system-dadaf.firebaseapp.com",
      projectId: "body-system-dadaf",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ---------- الساعة ----------
    function tickClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");
      document.getElementById("date").textContent = now.toLocaleDateString("ar-EG", {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
      });

      document.getElementById("big-clock").textContent = `${h}:${m}:${s}`;
      document.getElementById("big-clock-period").textContent = "";
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ---------- القائمة الجانبية: فتح/قفل ----------
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    function openSidebar() {
      sidebar.classList.add("open");
      overlay.classList.add("open");
    }
    function closeSidebar() {
      sidebar.classList.remove("open");
      overlay.classList.remove("open");
    }
    document.getElementById("logo-btn").addEventListener("click", openSidebar);
    document.getElementById("close-btn").addEventListener("click", closeSidebar);
    overlay.addEventListener("click", closeSidebar);

    // ---------- التبديل بين قائمة الأنظمة وفورم الإضافة ----------
    const listView = document.getElementById("list-view");
    const formView = document.getElementById("form-view");
    const logView = document.getElementById("log-view");

    function showList() {
      formView.style.display = "none";
      logView.style.display = "none";
      listView.style.display = "block";
    }

    document.getElementById("open-form-btn").addEventListener("click", function () {
      closeSidebar();
      listView.style.display = "none";
      formView.style.display = "block";
    });
    document.getElementById("back-btn").addEventListener("click", showList);

    document.getElementById("open-log-btn").addEventListener("click", function () {
      closeSidebar();
      listView.style.display = "none";
      logView.style.display = "block";
      loadLog();
    });
    document.getElementById("log-back-btn").addEventListener("click", showList);

    // ---------- التحقق من تسجيل الدخول ----------
    firebase.auth().onAuthStateChanged(function (user) {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      loadClients();
    });

    // ---------- شيت الإجراءات (دوسة طويلة) ----------
    const actionOverlay = document.getElementById("action-overlay");
    const actionTitle = document.getElementById("action-title");
    let currentActionId = null;

    function openActionSheet(id, name) {
      currentActionId = id;
      actionTitle.textContent = name;
      actionOverlay.classList.add("open");
    }
    function closeActionSheet() {
      actionOverlay.classList.remove("open");
      currentActionId = null;
    }
    document.getElementById("action-cancel").addEventListener("click", closeActionSheet);
    actionOverlay.addEventListener("click", function (e) {
      if (e.target === actionOverlay) closeActionSheet();
    });
    document.getElementById("action-delivered").addEventListener("click", function () {
      if (!currentActionId) return;
      db.collection("customers").doc(currentActionId).update({ delivered: true })
        .then(function () { closeActionSheet(); loadClients(); loadLog(); });
    });
    document.getElementById("action-pending").addEventListener("click", function () {
      if (!currentActionId) return;
      db.collection("customers").doc(currentActionId).update({ delivered: false })
        .then(function () { closeActionSheet(); loadClients(); loadLog(); });
    });
    document.getElementById("action-delete").addEventListener("click", function () {
      if (!currentActionId) return;
      db.collection("customers").doc(currentActionId).delete()
        .then(function () { closeActionSheet(); loadClients(); loadLog(); });
    });

    // دوسة طويلة عامة على أي عنصر بيدّيله data-id و data-name
    function attachLongPress(el, id, name) {
      let timer = null;
      let firedLongPress = false;

      function start() {
        firedLongPress = false;
        timer = setTimeout(function () {
          firedLongPress = true;
          openActionSheet(id, name);
        }, 550);
      }
      function cancel() { clearTimeout(timer); }

      el.addEventListener("touchstart", start, { passive: true });
      el.addEventListener("touchend", cancel);
      el.addEventListener("touchmove", cancel);
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", cancel);
      el.addEventListener("mouseleave", cancel);
      el.addEventListener("click", function (e) {
        if (firedLongPress) { e.preventDefault(); e.stopPropagation(); }
      });
    }

    // ---------- إضافة عميل جديد من القائمة الجانبية ----------
    document.getElementById("add-btn").addEventListener("click", function () {
      const name = document.getElementById("f-name").value.trim();
      const phone = document.getElementById("f-phone").value.trim();
      const email = document.getElementById("f-email").value.trim();
      const system = document.getElementById("f-system").value.trim();
      const place = document.getElementById("f-place").value.trim();
      const address = document.getElementById("f-address").value.trim();
      const deliveryDate = document.getElementById("f-date").value;
      const price = document.getElementById("f-price").value.trim();
      const dealmaker = document.getElementById("f-dealmaker").value.trim();
      const developer = document.getElementById("f-developer").value.trim();
      const notes = document.getElementById("f-notes").value.trim();
      const msg = document.getElementById("form-msg");

      if (!name || !deliveryDate) {
        msg.textContent = "اكتب الاسم ومعاد التسليم على الأقل";
        msg.className = "msg err";
        return;
      }

      db.collection("customers").add({
        name: name,
        phone: phone,
        email: email,
        system: system,
        place: place,
        address: address,
        deliveryDate: deliveryDate,
        price: price,
        dealmaker: dealmaker,
        developer: developer,
        notes: notes,
        active: true
      }).then(function () {
        msg.textContent = "اتضاف بنجاح";
        msg.className = "msg ok";
        ["f-name","f-phone","f-email","f-system","f-place","f-address","f-date","f-price","f-dealmaker","f-developer","f-notes"]
          .forEach(function (id) { document.getElementById(id).value = ""; });
        loadClients();
        setTimeout(showList, 700);
      }).catch(function (err) {
        msg.textContent = "مقدرش أضيف، تأكد من صلاحيات الكتابة (Rules)";
        msg.className = "msg err";
        console.error(err);
      });
    });

    // ---------- تحميل العملاء ومواعيد التسليم ----------
    function daysLeft(dateStr) {
      const target = new Date(dateStr);
      const now = new Date();
      const diffMs = target.setHours(0,0,0,0) - now.setHours(0,0,0,0);
      return Math.round(diffMs / (1000 * 60 * 60 * 24));
    }

    function loadClients() {
      db.collection("customers").get().then(function (snapshot) {
        const listEl = document.getElementById("list");
        listEl.innerHTML = "";

        if (snapshot.empty) {
          listEl.innerHTML = '<div class="empty">لسه مفيش عملاء مضافين</div>';
          return;
        }

        const docs = [];
        snapshot.forEach(function (doc) { docs.push(Object.assign({ id: doc.id }, doc.data())); });

        docs.sort(function (a, b) {
          if (!a.deliveryDate) return 1;
          if (!b.deliveryDate) return -1;
          return new Date(a.deliveryDate) - new Date(b.deliveryDate);
        });

        // ---------- الإحصائيات + قسم المتأخر ----------
        let pendingCount = 0, doneCount = 0, lateCount = 0, todayCount = 0;
        const lateDocs = [];
        docs.forEach(function (d) {
          if (d.delivered) { doneCount++; return; }
          pendingCount++;
          if (d.deliveryDate) {
            const r = daysLeft(d.deliveryDate);
            if (r < 0) { lateCount++; lateDocs.push(d); }
            else if (r === 0) { todayCount++; }
          }
        });
        document.getElementById("stat-pending").textContent = pendingCount;
        document.getElementById("stat-done").textContent = doneCount;
        document.getElementById("stat-late").textContent = lateCount;
        document.getElementById("stat-today").textContent = todayCount;

        const lateListEl = document.getElementById("late-list");
        lateListEl.innerHTML = "";
        if (lateDocs.length === 0) {
          lateListEl.innerHTML = '<div class="empty">مفيش حالات متأخرة 🎉</div>';
        } else {
          lateDocs.forEach(function (data) {
            const r = daysLeft(data.deliveryDate);
            const row = document.createElement("div");
            row.className = "card";
            row.style.marginTop = "10px";
            row.innerHTML = `
              <div class="name">${data.name || "عميل بدون اسم"}</div>
              <div class="system">${data.system || ""}</div>
              <div class="row">
                <span class="deadline">${new Date(data.deliveryDate).toLocaleDateString("ar-EG", { year:"numeric", month:"long", day:"numeric" })}</span>
                <span class="countdown late">متأخر ${Math.abs(r)} يوم</span>
              </div>
            `;
            attachLongPress(row, data.id, data.name || "عميل بدون اسم");
            lateListEl.appendChild(row);
          });
        }

        docs.forEach(function (data) {
          const name = data.name || "عميل بدون اسم";
          const system = data.system || "بدون تحديد نوع السيستيم";
          const deliveryDate = data.deliveryDate;

          let countdownHtml = "";
          let deadlineText = "معاد التسليم غير محدد";

          if (data.delivered) {
            deadlineText = deliveryDate
              ? new Date(deliveryDate).toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" })
              : "";
            countdownHtml = `<span class="countdown done">تم التسليم ✅</span>`;
          } else if (deliveryDate) {
            const remaining = daysLeft(deliveryDate);
            deadlineText = new Date(deliveryDate).toLocaleDateString("ar-EG", {
              year: "numeric", month: "long", day: "numeric"
            });
            let cls = "ok", label = `باقي ${remaining} يوم`;
            if (remaining < 0) { cls = "late"; label = `متأخر ${Math.abs(remaining)} يوم`; }
            else if (remaining === 0) { cls = "soon"; label = "التسليم النهاردة"; }
            else if (remaining <= 3) { cls = "soon"; label = `باقي ${remaining} يوم`; }
            countdownHtml = `<span class="countdown ${cls}">${label}</span>`;
          }

          const card = document.createElement("div");
          card.className = "card" + (data.delivered ? " delivered" : "");
          const place = data.place ? `${data.place}` : "";
          const price = data.price ? `${data.price} جنيه` : "";
          const phone = data.phone || "";
          const metaParts = [place, phone, price].filter(Boolean);
          const metaHtml = metaParts.length
            ? `<div class="system">${metaParts.join(" · ")}</div>`
            : "";
          card.innerHTML = `
            <div class="name">${name}</div>
            <div class="system">${system}</div>
            ${metaHtml}
            <div class="row">
              <span class="deadline">${deadlineText}</span>
              ${countdownHtml}
            </div>
          `;
          attachLongPress(card, data.id, name);
          listEl.appendChild(card);
        });
      }).catch(function (err) {
        document.getElementById("list").innerHTML =
          '<div class="empty">مقدرش أجيب البيانات، تأكد من صلاحيات القراءة (Rules)</div>';
        console.error(err);
      });
    }

    // ---------- سجل العملاء والأنظمة (تفاصيل كاملة) ----------
    function loadLog() {
      db.collection("customers").get().then(function (snapshot) {
        const logEl = document.getElementById("log-list");
        logEl.innerHTML = "";

        if (snapshot.empty) {
          logEl.innerHTML = '<div class="empty">لسه مفيش عملاء مضافين</div>';
          return;
        }

        const docs = [];
        snapshot.forEach(function (doc) { docs.push(Object.assign({ id: doc.id }, doc.data())); });

        docs.sort(function (a, b) {
          if (!a.deliveryDate) return 1;
          if (!b.deliveryDate) return -1;
          return new Date(a.deliveryDate) - new Date(b.deliveryDate);
        });

        docs.forEach(function (data) {
          const name = data.name || "عميل بدون اسم";
          const deliveryDate = data.deliveryDate
            ? new Date(data.deliveryDate).toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" })
            : "—";
          const status = data.delivered ? "تم التسليم ✅" : "لسه هيتسلم ⏳";

          const rows = [
            ["الحالة", status],
            ["رقم العميل", data.phone || "—"],
            ["الإيميل", data.email || "—"],
            ["نوع السيستيم", data.system || "—"],
            ["اسم المكان", data.place || "—"],
            ["العنوان", data.address || "—"],
            ["معاد التسليم", deliveryDate],
            ["المبلغ", data.price ? `${data.price} جنيه` : "—"],
            ["مسؤول الاتفاق", data.dealmaker || "—"],
            ["مسؤول التنفيذ", data.developer || "—"],
          ];

          const card = document.createElement("div");
          card.className = "log-card";
          card.innerHTML = `
            <div class="name">${name}</div>
            ${rows.map(function (r) {
              return `<div class="row2"><span>${r[0]}</span><span>${r[1]}</span></div>`;
            }).join("")}
            ${data.notes ? `<div class="notes">${data.notes}</div>` : ""}
          `;
          attachLongPress(card, data.id, name);
          logEl.appendChild(card);
        });
      }).catch(function (err) {
        document.getElementById("log-list").innerHTML =
          '<div class="empty">مقدرش أجيب البيانات، تأكد من صلاحيات القراءة (Rules)</div>';
        console.error(err);
      });
    }
  </script>
